name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Test and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: node -e "require('./scripts/publish-release.cjs').parseTag(process.env.GITHUB_REF_NAME)"

      - name: Verify release publishing and retry behavior
        run: node --test scripts/publish-release.test.cjs

      - name: Install .NET and restore NuGet cache
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json
            Directory.Build.props
            src/Clip.Desktop/Properties/PublishProfiles/win-x64.pubxml

      - name: Restore FFmpeg cache
        uses: actions/cache@v5
        with:
          path: .tools/ffmpeg
          key: ffmpeg-${{ runner.os }}-x64-${{ hashFiles('scripts/ffmpeg-version.json', 'scripts/Get-FFmpeg.ps1') }}

      - name: Get verified FFmpeg distribution
        run: ./scripts/Get-FFmpeg.ps1

      - name: Restore locked dependencies
        run: |
          dotnet restore tests/Clip.Tests/Clip.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/Clip.UpdateTests/Clip.UpdateTests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/Clip.Desktop/Clip.Desktop.csproj --locked-mode -p:PublishProfile=win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run core and FFmpeg integration tests
        run: |
          $env:CLIP_FFMPEG_DIR = Join-Path $env:GITHUB_WORKSPACE '.tools/ffmpeg'
          dotnet run --project tests/Clip.Tests -c Release --no-restore -- --integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained application
        run: ./scripts/Publish-Windows.ps1 -NoRestore

      - name: Verify update detection, package validation, and rollback
        run: |
          dotnet run --project tests/Clip.UpdateTests -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch normal startup and verify UI
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Clip-win-x64/Clip.exe'
          $env:CLIP_UI_TEST_VIDEO = Join-Path $env:GITHUB_WORKSPACE 'artifacts/UI sample.mp4'
          $ffmpeg = Join-Path $env:GITHUB_WORKSPACE '.tools/ffmpeg/ffmpeg.exe'
          & $ffmpeg -v error -y -f lavfi -i 'testsrc2=size=960x540:rate=30:duration=12' -f lavfi -i 'sine=frequency=440:duration=12' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest $env:CLIP_UI_TEST_VIDEO
          if ($LASTEXITCODE -ne 0) { throw 'UI test video could not be generated.' }
          $env:CLIP_UI_TEST_VIDEO_SECOND = Join-Path $env:GITHUB_WORKSPACE 'artifacts/UI second portrait.mp4'
          & $ffmpeg -v error -y -f lavfi -i 'color=orange:size=540x960:rate=24:duration=3.2' -c:v libx264 -preset ultrafast -pix_fmt yuv420p $env:CLIP_UI_TEST_VIDEO_SECOND
          if ($LASTEXITCODE -ne 0) { throw 'Second UI test video could not be generated.' }
          $env:CLIP_LOG_DIR = Join-Path $env:GITHUB_WORKSPACE 'artifacts/startup-logs'
          $env:DOTNET_HOST_TRACE = '1'
          $env:DOTNET_HOST_TRACEFILE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/startup-host.log'
          $process = Start-Process $app -ArgumentList '--startup-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Normal startup test timed out.'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Normal startup test failed: $($process.ExitCode)" }
          if (-not (Test-Path 'artifacts/Clip-win-x64/smoke-success.txt')) { throw 'UI verification did not finish.' }
          if (-not (Test-Path 'artifacts/Clip-win-x64/smoke-ui.png')) { throw 'UI screenshot missing.' }
          foreach ($state in @('empty', 'imported', 'multitrack', 'compact', 'export-basic', 'export-advanced')) {
            if (-not (Test-Path "artifacts/Clip-win-x64/smoke-$state.png")) { throw "Missing UI state screenshot: $state" }
          }
          foreach ($theme in @('light', 'dark')) {
            foreach ($surface in @('editor', 'export', 'name', 'notice', 'update')) {
              $capture = "artifacts/Clip-win-x64/smoke-theme-$theme-$surface.png"
              if (-not (Test-Path $capture)) { throw "Missing themed UI screenshot: $capture" }
            }
            Add-Type -AssemblyName System.Drawing
            $image = [System.Drawing.Image]::FromFile((Join-Path $env:GITHUB_WORKSPACE "artifacts/Clip-win-x64/smoke-theme-$theme-editor.png"))
            try {
              if ($image.Width -lt 3000 -or $image.Height -lt 2000) {
                throw "README screenshot resolution too low: $($image.Width) x $($image.Height)"
              }
            } finally { $image.Dispose() }
          }

      - name: Verify pre-WPF startup failure is logged
        run: |
          $env:CLIP_LOG_DIR = Join-Path $env:GITHUB_WORKSPACE 'artifacts/startup-failure-logs'
          $app = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Clip-win-x64/Clip.exe'
          $process = Start-Process $app -ArgumentList '--startup-failure-test' -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Startup error handling timed out.'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 1) { throw "Expected failure exit code 1, got $($process.ExitCode)" }
          if (-not (Get-ChildItem $env:CLIP_LOG_DIR -Filter '*.log' | Select-String 'CLIP_STARTUP_FAILURE_TEST')) {
            throw 'Startup failure was not recorded.'
          }

      - name: Verify README screenshot refresh and publishing guards
        run: ./scripts/Test-ReadmeScreenshots.ps1 -CaptureDirectory artifacts/Clip-win-x64

      - name: Print startup and UI diagnostics on failure
        if: failure()
        run: |
          $diagnostics = @(
            'artifacts/Clip-win-x64/smoke-error.txt'
            'artifacts/startup-logs/*.log'
            'artifacts/startup-failure-logs/*.log'
          )
          foreach ($pattern in $diagnostics) {
            Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "::group::$($_.Name)"
              Get-Content -LiteralPath $_.FullName
              Write-Host '::endgroup::'
            }
          }

      - name: Package, extract, and verify every published file
        run: ./scripts/Package-Windows.ps1

      - name: Verify independent updater and automatic restart
        run: |
          dotnet run --project tests/Clip.UpdateTests -c Release --no-build -- --windows-smoke artifacts/Clip-win-x64 artifacts/Clip-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload update smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-update-smoke-${{ github.run_number }}
          path: artifacts/update-smoke-*/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-UI-smoke-${{ github.run_number }}
          path: |
            artifacts/Clip-win-x64/smoke-*.png
            artifacts/Clip-win-x64/smoke-error.txt
            artifacts/Clip-win-x64/smoke-success.txt
            artifacts/startup-logs/**
            artifacts/startup-failure-logs/**
            artifacts/startup-host.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload package checksums and file manifest
        uses: actions/upload-artifact@v7
        with:
          name: Windows-package-checksums-${{ github.run_number }}
          path: |
            artifacts/Clip-win-x64.zip.sha256
            artifacts/Clip-win-x64.zip.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified Windows ZIP without recompression
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Clip-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified Windows ZIP without unpacking
        uses: actions/download-artifact@v8
        with:
          name: Clip-win-x64.zip
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Download checksums and file manifest
        uses: actions/download-artifact@v8
        with:
          name: Windows-package-checksums-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Generate notes, upload verified assets, and publish
        uses: actions/github-script@v8
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
        with:
          script: |
            await require('./scripts/publish-release.cjs').publishRelease({github, context, core});

  update-readme:
    name: Refresh README screenshots
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download this build's UI smoke screenshots
        uses: actions/download-artifact@v8
        with:
          name: Windows-UI-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/readme-ui

      - name: Publish changed screenshots to the tested branch
        shell: pwsh
        env:
          CAPTURE_ROOT: ${{ runner.temp }}/readme-ui
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          ./scripts/Update-ReadmeScreenshots.ps1
          -CaptureDirectory (Join-Path $env:CAPTURE_ROOT 'Clip-win-x64')
          -SourceCommit $env:SOURCE_COMMIT
          -RunId $env:WORKFLOW_RUN_ID
          -Branch $env:TARGET_BRANCH
          -Publish
